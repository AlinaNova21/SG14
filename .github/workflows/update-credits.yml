name: Update Credits

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update contributor credits
        uses: whoverseGames/ss14-actions/update-credits@v1
        with:
          output-file: ${{ vars.CREDITS_FILE }}
          min-commits: ${{ vars.MIN_COMMITS }}
          exclude-bots: ${{ vars.EXCLUDE_BOTS }}
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "${{ vars.GIT_USER_NAME }}"
          git config user.email "${{ vars.GIT_USER_EMAIL }}"
          git add ${{ vars.CREDITS_FILE }}
          git commit -m "Update contributor credits" || exit 0
          git push
