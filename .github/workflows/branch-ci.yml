name: Branch CI

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Test that packaging works correctly
  test-packaging:
    name: Test Packaging
    # Skip for bot users
    if: |
      github.actor != '${{ vars.GIT_USER_NAME }}' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Content.Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package server
        run: dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64 --skip-build

      - name: Package client
        run: dotnet run --project Content.Packaging client --no-wipe-release --skip-build

  # Test map renderer if it exists
  test-map-renderer:
    name: Test Map Renderer
    # Skip for bot users, only run if map renderer exists
    if: |
      github.actor != '${{ vars.GIT_USER_NAME }}' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Map Renderer
        if: hashFiles('Content.MapRenderer/Content.MapRenderer.csproj') != ''
        run: dotnet build Content.MapRenderer --configuration Release --no-restore /m

      - name: Run Map Renderer
        if: hashFiles('Content.MapRenderer/Content.MapRenderer.csproj') != ''
        run: dotnet run --project Content.MapRenderer --no-build Dev

  # Run full validation suite
  validation:
    name: Full Validation
    # Skip for bot users
    if: |
      github.actor != '${{ vars.GIT_USER_NAME }}' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore dependencies
        run: dotnet restore

      # Build and test
      - name: Build (Debug)
        run: dotnet build --configuration DebugOpt --no-restore /m

      - name: Run unit tests
        if: hashFiles('Content.Tests/Content.Tests.csproj') != ''
        run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0

      - name: Run integration tests
        if: hashFiles('Content.IntegrationTests/Content.IntegrationTests.csproj') != ''
        shell: pwsh
        run: |
          $env:DOTNET_gcServer=1
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

      # YAML validation
      - name: Run YAML Linter
        if: hashFiles('Content.YAMLLinter/Content.YAMLLinter.csproj') != ''
        run: |
          dotnet build Content.YAMLLinter --configuration Release --no-restore /m
          dotnet run --project Content.YAMLLinter/Content.YAMLLinter.csproj --no-build

      # Resource validation
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip3 install --user pillow jsonschema pyyaml

      - name: Validate RSIs
        if: hashFiles('RobustToolbox/Schemas/validate_rsis.py') != ''
        run: |
          if [ -d "Resources/" ]; then
            python3 RobustToolbox/Schemas/validate_rsis.py Resources/
          fi

  # Summary job for branch protection
  ci-success:
    name: Branch CI Success
    needs:
      - test-packaging
      - test-map-renderer
      - validation
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: echo "All branch CI checks passed!"
